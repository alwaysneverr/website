[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  GIT_SSH = "/bin/false"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, must-revalidate"

# The beer pages moved under their series name
[[redirects]]
  from = "/beers/"
  to = "/imosae/"
  status = 301

[[redirects]]
  from = "/legacy-site/beer/"
  to = "/legacy-site/imosae/"
  status = 301

# Book 1 characters renamed (the page address comes from the name)
[[redirects]]
  from = "/fiction/myproject/book1/darth-stickaul/"
  to = "/fiction/myproject/book1/darth-sticker/"
  status = 301

[[redirects]]
  from = "/fiction/myproject/book1/wright-wickedness-wilkinson/"
  to = "/fiction/myproject/book1/wright-wicked-wilkinson/"
  status = 301
